<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anthroprime.ai — Global GPU Infrastructure. One Partner.</title>
    <meta
      name="description"
      content="Anthroprime.ai provides GPU infrastructure for enterprises, AI companies and research organizations. Dedicated GPU capacity, clusters and managed AI infrastructure. One Partner. Global GPU Infrastructure."
    />
    <meta name="theme-color" content="#f5f4f1" />
    <script>
      /* Set theme before first paint to avoid a flash of the wrong theme. */
      ;(function () {
        try {
          var root = document.documentElement
          var saved = null
          try {
            saved = localStorage.getItem('ap-theme')
          } catch (e) {}
          var dark = saved === 'dark'
          root.classList.toggle('dark', dark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0f182b' : '#f5f4f1')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta
      property="og:title"
      content="Anthroprime.ai — Global GPU Infrastructure. One Partner."
    />
    <meta
      property="og:description"
      content="Deploy and scale with Anthroprime GPU infrastructure, dedicated clusters and managed AI environments."
    />
    <meta property="og:type" content="website" />
  </head>
  <body
    class="bg-bg text-text antialiased selection:bg-accent selection:text-bg"
  >
    <div id="root"></div>
    <noscript
      ><p>
        Enable JavaScript to explore Anthroprime GPU infrastructure. You can
        also contact
        <a href="mailto:hello@anthroprime.com">hello@anthroprime.com</a>
        directly.
      </p></noscript
    >
    <script type="module" src="/src/main.jsx"></script>
    <!-- Netlify form detection -->
    <form
      name="gpu-capacity"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="gpu-capacity" />
      <input
        type="hidden"
        name="subject"
        value="GPU capacity request — Anthroprime"
      />
      <input type="text" name="bot-field" />
      <input type="text" name="gpuType" />
      <input type="text" name="gpuQty" />
      <input type="text" name="location" />
      <input type="text" name="startDate" />
      <input type="text" name="duration" />
      <input type="text" name="workload" />
      <input type="text" name="deployType" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="consent" />
      <textarea name="brief"></textarea>
    </form>
  </body>
</html>
